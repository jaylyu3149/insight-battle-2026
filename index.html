<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>투표 시스템</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f5}.container{max-width:1200px;margin:0 auto;padding:2rem}.voter{max-width:600px;margin:0 auto;background:#fff;border-radius:12px;padding:2rem;box-shadow:0 2px 8px rgba(0,0,0,0.1)}.header{text-align:center;margin-bottom:2rem}.header h1{font-size:28px;font-weight:600;margin-bottom:8px}.form-group{margin-bottom:2rem}.label{font-size:14px;color:#666;margin-bottom:12px;display:block;font-weight:500}.slider{width:100%;height:6px;background:#ddd;margin-bottom:8px}.score-display{text-align:center;font-size:13px;color:#666;margin-bottom:8px}.score-display.kmba-done{color:#000}.score-display.ymba-done{color:#000}.score-labels{display:flex;justify-content:space-between;font-size:12px;color:#999}.vote-btn{width:100%;padding:14px;background:#4A90E2;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}.vote-btn:hover{background:#3875C5}.msg{background:#E8F5E9;border:1px solid #4CAF50;border-radius:8px;padding:1rem;text-align:center;margin-bottom:1.5rem}.msg p{color:#2E7D32;margin:0;font-weight:500}.msg .sub{font-size:12px;color:#388E3C;margin-top:4px}.admin{display:grid;grid-template-columns:1fr 1fr;gap:20px}.admin-h{grid-column:1/-1;margin-bottom:1rem}.admin-h h1{font-size:28px;font-weight:600;margin-bottom:8px}.card{background:#f9f9f9;border:1px solid #eee;border-radius:12px;padding:1.5rem}.label-stat{font-size:13px;color:#999;margin-bottom:12px}.value{font-size:32px;font-weight:600;margin-bottom:8px}.value.kmba{color:#E24B4A}.value.ymba{color:#4A90E2}.sub{font-size:12px;color:#999}.total{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:1rem 0}.total-card{border-radius:12px;padding:2rem;text-align:center}.total-kmba{background:#FCE8E8;border:1px solid #E9A2A2}.total-ymba{background:#E6F1FB;border:1px solid #85B7EB}.total-label{font-size:13px;margin-bottom:12px;font-weight:500}.total-label-kmba{color:#A32D2D}.total-label-ymba{color:#185FA5}.total-value{font-size:48px;font-weight:600}.total-value-kmba{color:#A32D2D}.total-value-ymba{color:#185FA5}.next{grid-column:1/-1;padding:14px;background:#4A90E2;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}.next:hover{background:#3875C5}.final{grid-column:1/-1;background:#E8F5E9;border:1px solid #4CAF50;border-radius:12px;padding:2rem;text-align:center}.final p{color:#2E7D32;margin:0;font-weight:600;font-size:18px}.final-sub{color:#388E3C;font-size:14px;margin-top:8px}.voter-list{grid-column:1/-1;background:#f9f9f9;border:1px solid #eee;border-radius:12px;padding:1.5rem}.voter-list h3{font-size:14px;font-weight:600;margin-bottom:1rem;color:#333}.voter-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:6px;margin-bottom:6px;font-size:13px}.voter-item.voted{background:#E8F5E9}.voter-item.not-voted{background:#FCE8E8}.voter-status{font-weight:500}.voted .voter-status{color:#2E7D32}.not-voted .voter-status{color:#A32D2D}.voter-id{color:#999;font-size:12px}.hidden{display:none}
    </style>
</head>
<body>
    <div id="voter" class="container hidden">
        <div class="voter">
            <div class="header">
                <h1>라운드 <span id="rnd">1</span></h1>
                <p>KMBA와 YMBA를 평가해주세요</p>
            </div>
            <div id="done" class="msg hidden">
                <p>✓ 투표가 완료되었습니다</p>
                <div class="sub">다음 라운드를 기다려주세요</div>
            </div>
            <div id="form">
                <div class="form-group">
                    <label class="label">KMBA 점수 선택</label>
                    <div class="score-display" id="sc1-display">점수: <span id="sc1">3</span>점</div>
                    <input type="range" id="sr1" class="slider" min="1" max="5" value="3" oninput="updateScore(this.value, 'sc1')">
                    <div class="score-labels"><span style="color:#E24B4A;font-weight:500">1점</span><span style="color:#E24B4A;font-weight:500">5점</span></div>
                </div>
                <div class="form-group">
                    <label class="label">YMBA 점수 선택</label>
                    <div class="score-display" id="sc2-display">점수: <span id="sc2">3</span>점</div>
                    <input type="range" id="sr2" class="slider" min="1" max="5" value="3" oninput="updateScore(this.value, 'sc2')">
                    <div class="score-labels"><span style="color:#4A90E2;font-weight:500">1점</span><span style="color:#4A90E2;font-weight:500">5점</span></div>
                </div>
                <button class="vote-btn" onclick="vote()">투표하기</button>
            </div>
        </div>
    </div>

    <div id="admin" class="container hidden">
        <div class="admin-h">
            <h1>투표 관리 대시보드</h1>
            <p>라운드 <span id="arnd">1</span> / 5</p>
            <p style="font-size:12px;color:#999;margin-top:8px">📊 <a href="https://docs.google.com/spreadsheets/d/1YIK0UxHhxeIfMXdNljFJ5QPdfwSwUAnvgBTNZnJmciU/edit" target="_blank" style="color:#4A90E2;text-decoration:none">Google Sheets 실시간 보기</a></p>
        </div>
        <div class="admin">
            <div class="card">
                <div class="label-stat">KMBA</div>
                <div class="value kmba" id="ka">0.0</div>
                <div class="sub"><span id="kc">0</span>명 투표</div>
            </div>
            <div class="card">
                <div class="label-stat">YMBA</div>
                <div class="value ymba" id="ya">0.0</div>
                <div class="sub"><span id="yc">0</span>명 투표</div>
            </div>
            <div class="total">
                <div class="total-card total-kmba">
                    <div class="total-label total-label-kmba">KMBA 누적점</div>
                    <div class="total-value total-value-kmba" id="kt">0.0</div>
                </div>
                <div class="total-card total-ymba">
                    <div class="total-label total-label-ymba">YMBA 누적점</div>
                    <div class="total-value total-value-ymba" id="yt">0.0</div>
                </div>
            </div>

            <div class="voter-list">
                <h3>투표자 현황 (라운드 <span id="list-round">1</span>)</h3>
                <div id="voter-list-container"></div>
            </div>

            <button id="nb" class="next" onclick="n()">다음 라운드로</button>
            <div id="fin" class="final hidden">
                <p id="win">🎉 KMBA 승리!</p>
                <div class="final-sub" id="ws"></div>
            </div>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzcfKvaU7GxdojQ81xYBqBuilSjAylcfwHMHRVsVJNEuq9B4HggIeP5OnP0bThXs_eV4A/exec';
        
        let r=1,v1=3,v2=3,vd={},adm=0,uid='',voterNum=0;
        
        function genUid(){
            let id=localStorage.getItem('uid');
            if(!id){
                voterNum=Math.floor(Math.random()*10000)+1;
                id='voter_'+voterNum;
                localStorage.setItem('uid',id);
                localStorage.setItem('voterNum',voterNum);
            }else{
                voterNum=parseInt(localStorage.getItem('voterNum'))||Math.floor(Math.random()*10000)+1;
            }
            return id;
        }
        
        function sendToSheets(round,kmba,ymba){
            const data={
                round:round,
                voter:voterNum,
                kmba:kmba,
                ymba:ymba
            };
            
            fetch(APPS_SCRIPT_URL,{
                method:'POST',
                body:JSON.stringify(data)
            }).catch(err=>console.log('Sheet 저장 완료'));
        }
        
        function init(){
            const p=new URLSearchParams(window.location.search);
            adm=p.get('admin')==='true';
            uid=genUid();
            if(adm)document.getElementById('admin').classList.remove('hidden');
            else document.getElementById('voter').classList.remove('hidden');
            ld();
            upd();
            if(!adm)setInterval(chk,2000);
            if(adm)setInterval(upd,500);
        }
        
        function ld(){
            const st=localStorage.getItem('vd');
            if(st){
                const d=JSON.parse(st);
                vd=d.vd||{};
                r=d.r||1;
            }
        }
        
        function sv(){
            localStorage.setItem('vd',JSON.stringify({vd,r}));
        }
        
        function updateScore(val,id){
            document.getElementById(id).textContent=val;
            if(id==='sc1')v1=parseInt(val);
            if(id==='sc2')v2=parseInt(val);
        }
        
        function vote(){
            const rk='r'+r;
            if(!vd[rk])vd[rk]={};
            const vid='vote_'+Date.now();
            vd[rk][vid]={u:uid,k:v1,y:v2};
            sv();
            
            sendToSheets(r,v1,v2);
            
            document.getElementById('form').classList.add('hidden');
            document.getElementById('done').classList.remove('hidden');
            document.getElementById('sc1-display').classList.add('kmba-done');
            document.getElementById('sc2-display').classList.add('ymba-done');
            sessionStorage.setItem('v'+r,'1');
        }
        
        function chk(){
            const st=localStorage.getItem('vd');
            if(st){
                const d=JSON.parse(st);
                const nr=d.r||1;
                if(nr!==r){
                    r=nr;
                    v1=3;v2=3;
                    sessionStorage.removeItem('v'+r);
                    document.getElementById('rnd').textContent=r;
                    document.getElementById('form').classList.remove('hidden');
                    document.getElementById('done').classList.add('hidden');
                    document.getElementById('sr1').value=3;
                    document.getElementById('sr2').value=3;
                    updateScore(3,'sc1');
                    updateScore(3,'sc2');
                    document.getElementById('sc1-display').classList.remove('kmba-done');
                    document.getElementById('sc2-display').classList.remove('ymba-done');
                }
            }
        }
        
        function grs(rnd){
            const rk='r'+rnd;
            const rv=vd[rk]||{};
            const kvs=Object.entries(rv).map(([,d])=>d.k||0);
            const yvs=Object.entries(rv).map(([,d])=>d.y||0);
            const ka=kvs.length>0?(kvs.reduce((a,b)=>a+b,0)/kvs.length).toFixed(1):'0.0';
            const ya=yvs.length>0?(yvs.reduce((a,b)=>a+b,0)/yvs.length).toFixed(1):'0.0';
            const vlist=Object.values(rv);
            const voted=new Set(vlist.map(v=>v.u));
            return{ka,ya,kc:kvs.length,yc:yvs.length,voted};
        }
        
        function gts(){
            let kt=0,yt=0;
            for(let i=1;i<=r;i++){
                const{ka,ya}=grs(i);
                kt+=parseFloat(ka)||0;
                yt+=parseFloat(ya)||0;
            }
            return{kt:kt.toFixed(1),yt:yt.toFixed(1)};
        }
        
        function getAllVoters(){
            const all=new Set();
            for(let i=1;i<=5;i++){
                const rk='r'+i;
                const rv=vd[rk]||{};
                Object.values(rv).forEach(v=>all.add(v.u));
            }
            return Array.from(all).sort();
        }
        
        function upd(){
            if(!adm)return;
            const st=grs(r);
            const tot=gts();
            document.getElementById('arnd').textContent=r;
            document.getElementById('list-round').textContent=r;
            document.getElementById('ka').textContent=st.ka;
            document.getElementById('ya').textContent=st.ya;
            document.getElementById('kc').textContent=st.kc;
            document.getElementById('yc').textContent=st.yc;
            document.getElementById('kt').textContent=tot.kt;
            document.getElementById('yt').textContent=tot.yt;
            
            const allVoters=getAllVoters();
            const voted=st.voted;
            let html='';
            allVoters.forEach((vid,idx)=>{
                const isVoted=voted.has(vid);
                const status=isVoted?'투표완료':'미투표';
                const className=isVoted?'voted':'not-voted';
                html+=`<div class="voter-item ${className}"><span class="voter-id">${idx+1}번</span><span class="voter-status">${status}</span></div>`;
            });
            document.getElementById('voter-list-container').innerHTML=html;
            
            if(r===5){
                document.getElementById('nb').classList.add('hidden');
                document.getElementById('fin').classList.remove('hidden');
                const wn=tot.kt>tot.yt?'KMBA':'YMBA';
                document.getElementById('win').textContent='🎉 '+wn+' 승리!';
                document.getElementById('ws').textContent='KMBA: '+tot.kt+'점 | YMBA: '+tot.yt+'점';
            }
        }
        
        function n(){
            if(r<5){
                r++;
                sv();
                upd();
            }
        }
        
        init();
    </script>
</body>
</html>
