<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>투표 시스템</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f5}.container{max-width:1200px;margin:0 auto;padding:2rem}.voter{max-width:600px;margin:0 auto;background:#fff;border-radius:12px;padding:2rem;box-shadow:0 2px 8px rgba(0,0,0,0.1)}.header{text-align:center;margin-bottom:2rem}.header h1{font-size:28px;font-weight:600;margin-bottom:8px}.form-group{margin-bottom:2rem}.label{font-size:14px;color:#666;margin-bottom:12px;display:block;font-weight:500}.team-buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{padding:16px;border:2px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;font-size:14px;font-weight:500}.btn:hover{border-color:#999}.btn.sel-blue{border-color:#4A90E2;background:#E6F1FB;color:#185FA5}.btn.sel-white{border-color:#888;background:#F1EFE8;color:#444}.slider{width:100%;height:6px;background:#ddd}.score-display{text-align:center;font-size:13px;color:#666;margin-bottom:12px}.score-labels{display:flex;justify-content:space-between;font-size:12px;color:#999;margin-top:8px}.vote-btn{width:100%;padding:14px;background:#4A90E2;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}.vote-btn:hover{background:#3875C5}.msg{background:#E8F5E9;border:1px solid #4CAF50;border-radius:8px;padding:1rem;text-align:center;margin-bottom:1.5rem}.msg p{color:#2E7D32;margin:0;font-weight:500}.admin{display:grid;grid-template-columns:1fr 1fr;gap:20px}.admin-h{grid-column:1/-1;margin-bottom:1rem}.admin-h h1{font-size:28px;font-weight:600;margin-bottom:8px}.card{background:#f9f9f9;border:1px solid #eee;border-radius:12px;padding:1.5rem}.label-stat{font-size:13px;color:#999;margin-bottom:12px}.value{font-size:32px;font-weight:600;margin-bottom:8px}.blue .value{color:#185FA5}.white .value{color:#444}.sub{font-size:12px;color:#999}.total{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:1rem 0}.total-card{border-radius:12px;padding:2rem;text-align:center}.total-blue{background:#E6F1FB;border:1px solid #85B7EB}.total-white{background:#F1EFE8;border:1px solid #B4B2A9}.total-label{font-size:13px;margin-bottom:12px;font-weight:500}.total-label-blue{color:#185FA5}.total-label-white{color:#444}.total-value{font-size:48px;font-weight:600}.total-blue .total-value{color:#185FA5}.total-white .total-value{color:#444}.next{grid-column:1/-1;padding:14px;background:#4A90E2;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}.next:hover{background:#3875C5}.final{grid-column:1/-1;background:#E8F5E9;border:1px solid #4CAF50;border-radius:12px;padding:2rem;text-align:center}.final p{color:#2E7D32;margin:0;font-weight:600;font-size:18px}.final-sub{color:#388E3C;font-size:14px;margin-top:8px}.hidden{display:none}
    </style>
</head>
<body>
    <div id="voter" class="container hidden">
        <div class="voter">
            <div class="header">
                <h1>라운드 <span id="rnd">1</span></h1>
                <p>각 스피커별 인사이트 점수를 투표해주세요</p>
            </div>
            <div id="done" class="msg hidden">
                <p>✓ 투표가 완료되었습니다</p>
            </div>
            <div id="form">
                <div class="form-group">
                    <label class="label">팀 선택</label>
                    <div class="team-buttons">
                        <button class="btn" id="bb" onclick="selectTeam('red')">KMBA (A)</button>
                        <button class="btn" id="bw" onclick="selectTeam('blue')">YMBA (B)</button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="label">점수 선택</label>
                    <div class="score-display">점수: <span id="sc">3</span>점</div>
                    <input type="range" id="sr" class="slider" min="1" max="5" value="3" oninput="updateScore(this.value)">
                    <div class="score-labels"><span>1점</span><span>5점</span></div>
                </div>
                <button class="vote-btn" onclick="vote()">투표하기</button>
            </div>
        </div>
    </div>

    <div id="admin" class="container hidden">
        <div class="admin-h">
            <h1>투표 관리 대시보드</h1>
            <p>라운드 <span id="arnd">1</span> / 5</p>
        </div>
        <div class="admin">
            <div class="card blue">
                <div class="label-stat">KMBA (A)</div>
                <div class="value" id="ba">0.0</div>
                <div class="sub"><span id="bc">0</span>명 투표</div>
            </div>
            <div class="card white">
                <div class="label-stat">YMBA (B)</div>
                <div class="value" id="wa">0.0</div>
                <div class="sub"><span id="wc">0</span>명 투표</div>
            </div>
            <div class="total">
                <div class="total-card total-blue">
                    <div class="total-label total-label-blue">KMBA 누적점</div>
                    <div class="total-value" id="bt">0.0</div>
                </div>
                <div class="total-card total-white">
                    <div class="total-label total-label-white">YMBA 누적점</div>
                    <div class="total-value" id="wt">0.0</div>
                </div>
            </div>
            <button id="nb" class="next" onclick="nextRound()">다음 라운드로</button>
            <div id="fin" class="final hidden">
                <p id="win">🎉KMBA 승리!</p>
                <div class="final-sub" id="ws"></div>
            </div>
        </div>
    </div>

    <script>
        let round=1,selectedTeam='blue',hasVoted=0,votes={},isAdmin=0;
        
        function init(){
            const params=new URLSearchParams(window.location.search);
            isAdmin=params.get('admin')==='true';
            if(isAdmin)document.getElementById('admin').classList.remove('hidden');
            else document.getElementById('voter').classList.remove('hidden');
            loadData();
            selectTeam('blue');
            updateDisplay();
            if(!isAdmin)setInterval(checkNewRound,2000);
            if(isAdmin)setInterval(updateDisplay,1000);
        }
        
        function loadData(){
            const stored=localStorage.getItem('voting_data');
            if(stored){
                const data=JSON.parse(stored);
                votes=data.votes||{};
                round=data.round||1;
            }
        }
        
        function saveData(){
            localStorage.setItem('voting_data',JSON.stringify({votes,round}));
        }
        
        function selectTeam(team){
            selectedTeam=team;
            document.getElementById('bb').classList.remove('sel-blue');
            document.getElementById('bw').classList.remove('sel-white');
            if(team==='blue')document.getElementById('bb').classList.add('sel-blue');
            else document.getElementById('bw').classList.add('sel-white');
        }
        
        function updateScore(value){
            document.getElementById('sc').textContent=value;
        }
        
        function vote(){
            const score=parseInt(document.getElementById('sr').value);
            const roundKey='round_'+round;
            if(!votes[roundKey])votes[roundKey]={};
            votes[roundKey][selectedTeam+'_'+Date.now()]=score;
            saveData();
            hasVoted=1;
            document.getElementById('form').classList.add('hidden');
            document.getElementById('done').classList.remove('hidden');
            sessionStorage.setItem('voted_'+round,'1');
        }
        
        function checkNewRound(){
            const stored=localStorage.getItem('voting_data');
            if(stored){
                const data=JSON.parse(stored);
                const newRound=data.round||1;
                if(newRound!==round){
                    round=newRound;
                    hasVoted=0;
                    sessionStorage.removeItem('voted_'+round);
                    document.getElementById('rnd').textContent=round;
                    document.getElementById('form').classList.remove('hidden');
                    document.getElementById('done').classList.add('hidden');
                    document.getElementById('sr').value=3;
                    updateScore(3);
                    selectTeam('blue');
                }
            }
        }
        
        function getRoundStats(rnd){
            const roundKey='round_'+rnd;
            const roundVotes=votes[roundKey]||{};
            const blueVotes=Object.entries(roundVotes).filter(([key])=>key.startsWith('blue')).map(([,score])=>score);
            const whiteVotes=Object.entries(roundVotes).filter(([key])=>key.startsWith('white')).map(([,score])=>score);
            const blueAvg=blueVotes.length>0?(blueVotes.reduce((a,b)=>a+b,0)/blueVotes.length).toFixed(1):'0.0';
            const whiteAvg=whiteVotes.length>0?(whiteVotes.reduce((a,b)=>a+b,0)/whiteVotes.length).toFixed(1):'0.0';
            return {blueAvg,whiteAvg,blueCount:blueVotes.length,whiteCount:whiteVotes.length};
        }
        
        function getTotalScores(){
            let blueTotal=0,whiteTotal=0;
            for(let r=1;r<=round;r++){
                const {blueAvg,whiteAvg}=getRoundStats(r);
                blueTotal+=parseFloat(blueAvg)||0;
                whiteTotal+=parseFloat(whiteAvg)||0;
            }
            return {blueTotal:blueTotal.toFixed(1),whiteTotal:whiteTotal.toFixed(1)};
        }
        
        function updateDisplay(){
            if(!isAdmin)return;
            const stats=getRoundStats(round);
            const totals=getTotalScores();
            document.getElementById('arnd').textContent=round;
            document.getElementById('ba').textContent=stats.blueAvg;
            document.getElementById('wa').textContent=stats.whiteAvg;
            document.getElementById('bc').textContent=stats.blueCount;
            document.getElementById('wc').textContent=stats.whiteCount;
            document.getElementById('bt').textContent=totals.blueTotal;
            document.getElementById('wt').textContent=totals.whiteTotal;
            if(round===5){
                document.getElementById('nb').classList.add('hidden');
                document.getElementById('fin').classList.remove('hidden');
                const winner=totals.blueTotal>totals.whiteTotal?'청팀':'백팀';
                document.getElementById('win').textContent='🎉 '+winner+' 승리!';
                document.getElementById('ws').textContent='청팀: '+totals.blueTotal+'점 | 백팀: '+totals.whiteTotal+'점';
            }
        }
        
        function nextRound(){
            if(round<5){
                round++;
                saveData();
                updateDisplay();
            }
        }
        
        init();
    </script>
</body>
</html>
